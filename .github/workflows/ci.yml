name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B verify
      - name: Smoke test the jar
        run: |
          java -jar target/glucose-pipeline.jar --demo --port 18080 &
          sleep 3
          curl -sf localhost:18080/healthz
          curl -sf localhost:18080/v1/subjects/subject-002/summary | grep -q tir_below_target
